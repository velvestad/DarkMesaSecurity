# Simple workflow to run tests on a self-hosted runner

name: Deploy Test

on:
  workflow_dispatch:
  push:
    branches:
      - dev

env:
  TF_VAR_host_ip: ${{ vars.TF_VAR_HOST_IP }}
  TF_VAR_host_username: ${{ secrets.TF_VAR_HOST_USERNAME }}
  TF_VAR_host_password: ${{ secrets.TF_VAR_HOST_PASSWORD }}

# Sets default to be the test directory for all run commands
defaults:
  run:
    working-directory: ./infrastructure/terraform/.test

jobs:
  plan:
    runs-on: [self-hosted]
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Terraform version
        run: terraform --version

      - name: Init
        run: terraform init
      
      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan --out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infrastructure/terraform/.test/tfplan
  apply: 
    runs-on: [self-hosted]
    needs: plan
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infrastructure/terraform/.test

      - name: Terraform Apply
        run: terraform apply tfplan